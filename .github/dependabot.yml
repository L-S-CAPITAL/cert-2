version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and its type packages must move together: react-dom and
      # @types/react-dom peer-depend on a matching react / @types/react
      # (e.g. ^19.3.0), so bumping one alone breaks npm ci (see #7). Covers
      # every update type, majors included. Listed first because Dependabot
      # puts a dependency in the first group that matches it.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # One PR per week for all other minor/patch bumps; majors stay separate.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
